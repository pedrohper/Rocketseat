version: '3.8'

services:
  findafriend-pg:
    image: bitnami/postgresql:latest
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=docker
      - POSTGRES_PASSWORD=docker
      - POSTGRES_DB=findafriendapi
    volumes:
      - findafriend_pg_data:/bitnami/postgresql

volumes:
  findafriend_pg_data: